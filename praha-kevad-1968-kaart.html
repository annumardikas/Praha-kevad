<title>Praha kevad 1968</title>
<style>
:root{--bg:#f3f4f7;--ink:#14213a;--mut:#58637a;--card:#fff;--line:#cdd4e0;--red:#c8102e;--blue:#11457e;--land:#e1e7ef;--water:#9bbbd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--ink:#eef2f8;--mut:#9ca8bd;--card:#18223a;--line:#2d3b58;--red:#ef4a63;--blue:#6a9be0;--land:#1a2538;--water:#27425f}}
:root[data-theme="dark"]{--bg:#0f1624;--ink:#eef2f8;--mut:#9ca8bd;--card:#18223a;--line:#2d3b58;--red:#ef4a63;--blue:#6a9be0;--land:#1a2538;--water:#27425f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:20px 18px 40px}
h1{font-size:34px;line-height:1.05;margin:0 0 6px;font-weight:800}
h2{font-size:24px;margin:16px 0 8px;font-weight:800}
p{margin:0 0 14px;font-size:17px;max-width:62ch}
.mut{color:var(--mut);font-size:15px}
svg{display:block;width:100%;height:auto;border-radius:10px;border:2px solid var(--line)}
.bars{display:grid;gap:8px;margin:0 0 14px}
.bar{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:10px;font-size:14px;color:var(--mut)}
.track{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.fill{height:100%;transition:width .4s}.f1{background:var(--blue)}.f2{background:var(--red)}
button{display:block;width:100%;text-align:left;font:inherit;font-size:17px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 10px;cursor:pointer}
button:hover{border-color:var(--blue)}
button:focus-visible,.pl:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button.go{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700;text-align:center}
.cast{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}.cast button{text-align:center;margin:0}.cast button.on{border-color:var(--red)}.cast svg{width:64px;height:96px;margin:0 auto;border:0;border-radius:0}
.l1,.l2{transform-box:fill-box;transform-origin:50% 0}.w .l1{animation:lg .3s infinite alternate}.w .l2{animation:lg .3s infinite alternate-reverse}.w .fig{animation:bb .3s infinite alternate}@keyframes lg{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}@keyframes bb{from{transform:translateY(0)}to{transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.w .l1,.w .l2,.w .fig{animation:none}}
.f3{background:#2a9d8f}.f4{background:#d99a00}
.term{border-bottom:2px dotted var(--blue);cursor:pointer;font-weight:600}.term:hover{background:var(--line)}.term:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#gl{position:fixed;inset:0;background:rgba(10,16,28,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.gc{background:var(--card);color:var(--ink);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px))}.gc h3{margin:0 0 8px;font-size:22px}
.res{border-left:5px solid var(--red);padding:2px 0 2px 14px;margin:18px 0}
.fact{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:14px 16px;margin:18px 0}
.fact p{font-size:16px;margin:0 0 10px}.fact p:last-child{margin:0}
.land{fill:var(--land)}.water{stroke:var(--water);fill:none;stroke-width:36}
.pl{cursor:pointer}.pl circle.dot{fill:var(--card);stroke:var(--blue);stroke-width:3}
.pl text{font:700 12px "Helvetica Neue",Arial,sans-serif;fill:var(--ink);text-anchor:middle;pointer-events:none}
.ring{fill:none;stroke:var(--red);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:pu 1.6s ease-out infinite}
@keyframes pu{from{transform:scale(1);opacity:1}to{transform:scale(1.9);opacity:0}}
#me{transition:transform .8s ease-in-out}
@media (prefers-reduced-motion:reduce){.ring{animation:none}#me,.fill{transition:none}}
</style>
</head>

const SC=[
{p:"t",pic:1,d:"5. jaanuar 1968",t:"Alexander Dubček valitakse Tšehhoslovakkia Kommunistliku Partei esimeseks sekretäriks. Sa oled noor ajakirjanik Praha ajalehes. Toimetuses sosistatakse, et midagi hakkab muutuma.",

  A.innerHTML=bars()+'<h2>Sinu lugu</h2><p>'+(nt===2?"Sa läksid sel ööl Raadio Praha juurde. See oli üks sinu elu raskemaid ja tähtsamaid hetki. Sa nägid, kui palju tähendab vaba sõna.":nt===1?"Sel ööl kadusid Praha tänavasildid. Sinu käsi oli selles ja see jäi sinu saladuseks.":e)+'</p>'+rw()+'<div class="fact"><p><b>Mis tegelikult juhtus</b></p><p>Praha kevad lõppes 21. augustil 1968 Varssavi pakti riikide sissetungiga. Dubček naasis Moskvast 27. augustil ja nõustus reforme piirama.</p><p>Esimestel nädalatel hukkus 72 tšehhi ja slovaki, neist 19 Slovakkias, ja üle 260 sai raskelt viga. Nõukogude väed jäid riiki 1991. aastani. Dubček eemaldati ametist ja tema reformid tühistati.</p><p>Algas „normaliseerimine“, mis kestis umbes 20 aastat. Reformidest jäi püsima vaid riigi jagamine kaheks võrdseks osaks, Tšehhiks ja Slovakkiaks. 1989. aastal tuli Sametrevolutsioon.</p></div><button class="go" id="re">Mängi uuesti</button>';
